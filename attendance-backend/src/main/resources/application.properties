spring.application.name=college-attendance

server.port=8080

# ===============================
# Database
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/college_attendance
spring.datasource.username=root
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Jackson
# ===============================

spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# Face Recognition Service
# ===============================

face.service.url=http://127.0.0.1:8000

# ===============================
# Attendance Face Matching
# ===============================

face.match.threshold=80.0
face.match.high-confidence=90.0

jwt.secret=college-attendance-system-secret-key-2026-very-secure

# ===============================
# Attendance Location / Geofence
# ===============================

attendance.location.latitude=28.1222106
attendance.location.longitude=77.5538813
attendance.location.radius-meters=200

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
