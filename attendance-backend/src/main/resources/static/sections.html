<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sections | Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common Sidebar -->
    <link rel="stylesheet" href="/css/sidebar.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1e293b;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Scope these because sidebar also has admin-info/admin-name/admin-role */
        .navbar .admin-info {
            text-align: right;
        }

        .navbar .admin-name {
            font-size: 14px;
            font-weight: 600;
        }

        .navbar .admin-role {
            font-size: 11px;
            color: #64748b;
        }

        .avatar {
            width: 38px;
            height: 38px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* =========================
           CONTENT
        ========================== */

        .content {
            padding: 30px;
        }

        .breadcrumb {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .breadcrumb span {
            color: #2563eb;
        }

        /* =========================
           STATS
        ========================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: 700;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .blue {
            background: #dbeafe;
        }

        .green {
            background: #dcfce7;
        }

        .gray {
            background: #f1f5f9;
        }

        /* =========================
           CARD
        ========================== */

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
        }

        .card-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        /* =========================
           BUTTON
        ========================== */

        .btn {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* =========================
           FILTERS
        ========================== */

        .filters {
            padding: 18px 20px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .search {
            flex: 1;
        }

        .input,
        .select {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            padding: 10px 12px;
            outline: none;
            background: white;
            font-size: 13px;
        }

        .input:focus,
        .select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px #dbeafe;
        }

        .filter-select {
            width: 180px;
        }

        /* =========================
           TABLE
        ========================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            padding: 13px 18px;
            letter-spacing: 0.4px;
        }

        td {
            padding: 15px 18px;
            border-top: 1px solid #eef2f7;
            font-size: 13px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .section-name {
            font-weight: 600;
        }

        .section-id {
            color: #64748b;
            font-size: 11px;
            margin-top: 3px;
        }

        .semester-info {
            font-weight: 600;
        }

        .semester-id {
            color: #64748b;
            font-size: 11px;
            margin-top: 3px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-active {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        /* =========================
           MODAL
        ========================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .close {
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }

        .modal-body {
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        .required {
            color: #dc2626;
        }

        .modal-footer {
            padding: 18px 22px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =========================
           TOAST
        ========================== */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            min-width: 280px;
            max-width: 400px;
            background: #111827;
            color: white;
            padding: 14px 18px;
            border-radius: 8px;
            display: none;
            z-index: 3000;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            background: #15803d;
        }

        .toast.error {
            background: #dc2626;
        }

        /* =========================
           LOADER / EMPTY
        ========================== */

        .loader {
            text-align: center;
            padding: 35px;
            color: #64748b;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #64748b;
            font-size: 13px;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            padding: 20px 30px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .filter-select {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            .content {
                padding: 18px;
            }

            .navbar {
                padding: 0 18px;
            }

            .navbar .admin-info {
                display: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .modal {
                max-height: 95vh;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         REUSABLE SIDEBAR
    ========================== -->

    <div id="sidebar-container"></div>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-wrapper">

        <!-- =========================
             NAVBAR
        ========================== -->

        <nav class="navbar">

            <div style="display:flex;align-items:center;gap:15px;">

                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    ☰
                </button>

                <div class="page-title">
                    Sections
                </div>

            </div>


            <div class="nav-right">

                <div class="admin-info">

                    <div class="admin-name">
                        Administrator
                    </div>

                    <div class="admin-role">
                        System Admin
                    </div>

                </div>

                <div class="avatar">
                    A
                </div>

            </div>

        </nav>


        <!-- =========================
             CONTENT
        ========================== -->

        <section class="content">

            <div class="breadcrumb">
                Admin / <span>Sections</span>
            </div>


            <!-- =========================
                 STATS
            ========================== -->

            <div class="stats">

                <div class="stat-card">

                    <div>

                        <div class="stat-label">
                            Total Sections
                        </div>

                        <div class="stat-value" id="totalSections">
                            0
                        </div>

                    </div>

                    <div class="stat-icon blue">
                        §
                    </div>

                </div>


                <div class="stat-card">

                    <div>

                        <div class="stat-label">
                            Active Sections
                        </div>

                        <div class="stat-value" id="activeSections">
                            0
                        </div>

                    </div>

                    <div class="stat-icon green">
                        ✓
                    </div>

                </div>


                <div class="stat-card">

                    <div>

                        <div class="stat-label">
                            Inactive Sections
                        </div>

                        <div class="stat-value" id="inactiveSections">
                            0
                        </div>

                    </div>

                    <div class="stat-icon gray">
                        —
                    </div>

                </div>

            </div>


            <!-- =========================
                 SECTION TABLE
            ========================== -->

            <div class="card">

                <div class="card-header">

                    <div>

                        <div class="card-title">
                            Section Management
                        </div>

                        <div class="card-subtitle">
                            Create, update and manage college sections
                        </div>

                    </div>


                    <button type="button" class="btn btn-primary" onclick="openAddModal()">

                        + Add Section

                    </button>

                </div>


                <!-- FILTERS -->

                <div class="filters">

                    <div class="search">

                        <input type="text" id="searchInput" class="input"
                            placeholder="Search by section name or semester..." oninput="filterSections()">

                    </div>


                    <div class="filter-select">

                        <select id="statusFilter" class="select" onchange="filterSections()">

                            <option value="ALL">
                                All Status
                            </option>

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="INACTIVE">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <!-- TABLE -->

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Section
                                </th>

                                <th>
                                    Semester
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="sectionTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <footer>
            © 2026 College Attendance System. All rights reserved.
        </footer>

    </main>


    <!-- =========================
         ADD / EDIT MODAL
    ========================== -->

    <div class="modal-overlay" id="sectionModal">

        <div class="modal">

            <div class="modal-header">

                <div class="modal-title" id="modalTitle">
                    Add Section
                </div>

                <button type="button" class="close" onclick="closeModal()">

                    ×

                </button>

            </div>


            <form id="sectionForm" onsubmit="saveSection(event)">

                <div class="modal-body">

                    <div class="form-grid">

                        <!-- SECTION NAME -->

                        <div class="form-group full">

                            <label class="form-label">

                                Section Name

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <input type="text" id="name" class="input" placeholder="e.g. A" required>

                        </div>


                        <!-- SEMESTER -->

                        <div class="form-group full">

                            <label class="form-label">

                                Semester

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <select id="semesterId" class="select" required>

                                <option value="">
                                    Select Semester
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" onclick="closeModal()">

                        Cancel

                    </button>


                    <button type="submit" class="btn btn-primary" id="saveBtn">

                        Save Section

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div class="toast" id="toast"></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="/js/auth.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>


    <script>

        /*
         * Backend base URL
         */
        const API_BASE_URL =
            "http://localhost:8080";


        let sections = [];

        let semesters = [];

        let editingSectionId = null;


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                await loadSemesters();

                await loadSections();

            }
        );


        // ==========================================
        // LOAD SEMESTERS
        // ==========================================

        async function loadSemesters() {

            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/admin/semesters`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load semesters"
                    );

                }


                semesters =
                    await response.json();


                const select =
                    document.getElementById(
                        "semesterId"
                    );


                select.innerHTML = `
                    <option value="">
                        Select Semester
                    </option>
                `;


                semesters.forEach(
                    semester => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            semester.id;


                        option.textContent =
                            `Semester ${semester.semesterNumber}`;


                        select.appendChild(
                            option
                        );

                    }
                );


            } catch (error) {

                console.error(error);


                showToast(
                    "Unable to load semesters",
                    "error"
                );

            }

        }


        // ==========================================
        // LOAD SECTIONS
        // ==========================================

        async function loadSections() {

            const tbody =
                document.getElementById(
                    "sectionTableBody"
                );


            tbody.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="loader">
                            Loading sections...
                        </div>
                    </td>
                </tr>
            `;


            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/admin/sections`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load sections"
                    );

                }


                sections =
                    await response.json();


                updateStats();


                renderSections(
                    sections
                );


            } catch (error) {

                console.error(error);


                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty">
                                Failed to load sections.
                            </div>
                        </td>
                    </tr>
                `;


                showToast(
                    error.message,
                    "error"
                );

            }

        }


        // ==========================================
        // RENDER SECTIONS
        // ==========================================

        function renderSections(data) {

            const tbody =
                document.getElementById(
                    "sectionTableBody"
                );


            if (!data.length) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty">
                                No sections found.
                            </div>
                        </td>
                    </tr>
                `;

                return;

            }


            tbody.innerHTML =
                data.map(
                    (section, index) => {

                        const statusClass =
                            section.status === "ACTIVE"
                                ? "badge-active"
                                : "badge-inactive";


                        const semester =
                            getSemesterById(
                                section.semesterId
                            );


                        const semesterNumber =
                            semester
                                ? semester.semesterNumber
                                : "-";


                        return `
                            <tr>

                                <td>
                                    ${index + 1}
                                </td>


                                <td>

                                    <div class="section-name">
                                        ${escapeHtml(
                            section.name || "-"
                        )}
                                    </div>

                                    <div class="section-id">
                                        ID: ${section.id}
                                    </div>

                                </td>


                                <td>

                                    <div class="semester-info">
                                        ${semesterNumber !== "-"
                                ? `Semester ${escapeHtml(semesterNumber)}`
                                : "-"
                            }
                                    </div>

                                    <div class="semester-id">
                                        Semester ID:
                                        ${section.semesterId || "-"}
                                    </div>

                                </td>


                                <td>

                                    <span
                                        class="badge ${statusClass}">

                                        ${escapeHtml(
                                section.status || "-"
                            )}

                                    </span>

                                </td>


                                <td>

                                    <div class="actions">

                                        <button
                                            type="button"
                                            class="action-btn btn-edit"
                                            onclick="editSection(${section.id})">

                                            Edit

                                        </button>


                                        ${section.status === "ACTIVE"
                                ?
                                `
                                                <button
                                                    type="button"
                                                    class="action-btn btn-danger"
                                                    onclick="deactivateSection(${section.id})">

                                                    Deactivate

                                                </button>
                                                `
                                :
                                ""
                            }

                                    </div>

                                </td>

                            </tr>
                        `;

                    }
                ).join("");

        }


        // ==========================================
        // GET SEMESTER
        // ==========================================

        function getSemesterById(id) {

            return semesters.find(
                semester =>
                    Number(semester.id) ===
                    Number(id)
            );

        }


        // ==========================================
        // FILTER
        // ==========================================

        function filterSections() {

            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const status =
                document
                    .getElementById(
                        "statusFilter"
                    )
                    .value;


            const filtered =
                sections.filter(
                    section => {

                        const semester =
                            getSemesterById(
                                section.semesterId
                            );


                        const semesterText =
                            semester
                                ? `semester ${semester.semesterNumber}`
                                : "";


                        const searchable =
                            `
                            ${section.name || ""}
                            ${section.semesterId || ""}
                            ${semesterText}
                            `.toLowerCase();


                        const matchesSearch =
                            searchable.includes(
                                search
                            );


                        const matchesStatus =
                            status === "ALL"
                            ||
                            section.status === status;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );


            renderSections(
                filtered
            );

        }


        // ==========================================
        // STATS
        // ==========================================

        function updateStats() {

            const total =
                sections.length;


            const active =
                sections.filter(
                    section =>
                        section.status === "ACTIVE"
                ).length;


            const inactive =
                sections.filter(
                    section =>
                        section.status === "INACTIVE"
                ).length;


            document.getElementById(
                "totalSections"
            ).textContent =
                total;


            document.getElementById(
                "activeSections"
            ).textContent =
                active;


            document.getElementById(
                "inactiveSections"
            ).textContent =
                inactive;

        }


        // ==========================================
        // OPEN ADD MODAL
        // ==========================================

        function openAddModal() {

            editingSectionId = null;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Add Section";


            document.getElementById(
                "saveBtn"
            ).textContent =
                "Save Section";


            document
                .getElementById(
                    "sectionForm"
                )
                .reset();


            document
                .getElementById(
                    "sectionModal"
                )
                .classList.add(
                    "show"
                );

        }


        // ==========================================
        // EDIT SECTION
        // ==========================================

        function editSection(id) {

            const section =
                sections.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!section) {

                return;

            }


            editingSectionId =
                id;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Section";


            document.getElementById(
                "saveBtn"
            ).textContent =
                "Update Section";


            document.getElementById(
                "name"
            ).value =
                section.name || "";


            document.getElementById(
                "semesterId"
            ).value =
                section.semesterId || "";


            document
                .getElementById(
                    "sectionModal"
                )
                .classList.add(
                    "show"
                );

        }


        // ==========================================
        // SAVE / UPDATE
        // ==========================================

        async function saveSection(event) {

            event.preventDefault();


            const saveBtn =
                document.getElementById(
                    "saveBtn"
                );


            const request = {

                semesterId:
                    Number(
                        document.getElementById(
                            "semesterId"
                        ).value
                    ),

                name:
                    document.getElementById(
                        "name"
                    ).value.trim()

            };


            if (!request.semesterId) {

                showToast(
                    "Please select a semester",
                    "error"
                );

                return;

            }


            if (!request.name) {

                showToast(
                    "Section name is required",
                    "error"
                );

                return;

            }


            /*
             * Save current editing state before request.
             * This prevents the finally block from losing
             * the correct button text after closeModal().
             */
            const isEditing =
                !!editingSectionId;


            try {

                saveBtn.disabled = true;


                saveBtn.textContent =
                    isEditing
                        ? "Updating..."
                        : "Saving...";


                let url =
                    `${API_BASE_URL}/api/admin/sections`;


                let method =
                    "POST";


                if (isEditing) {

                    url =
                        `${API_BASE_URL}/api/admin/sections/${editingSectionId}`;

                    method =
                        "PUT";

                }


                const response =
                    await apiFetch(
                        url,
                        {
                            method: method,

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    request
                                )
                        }
                    );


                if (!response.ok) {

                    let message =
                        "Unable to save section";


                    try {

                        const error =
                            await response.json();


                        message =
                            error.message
                            ||
                            error.error
                            ||
                            message;

                    } catch (e) {

                        // Ignore JSON parse error

                    }


                    throw new Error(
                        message
                    );

                }


                /*
                 * Backend may return an empty body.
                 * Do not force response.json().
                 */
                if (response.status !== 204) {

                    const contentType =
                        response.headers.get(
                            "content-type"
                        );


                    if (
                        contentType &&
                        contentType.includes(
                            "application/json"
                        )
                    ) {

                        await response.json();

                    }

                }


                closeModal();


                await loadSections();


                showToast(
                    isEditing
                        ? "Section updated successfully"
                        : "Section created successfully",
                    "success"
                );


            } catch (error) {

                console.error(error);


                showToast(
                    error.message,
                    "error"
                );


            } finally {

                saveBtn.disabled =
                    false;


                saveBtn.textContent =
                    isEditing
                        ? "Update Section"
                        : "Save Section";

            }

        }


        // ==========================================
        // DEACTIVATE
        // ==========================================

        async function deactivateSection(id) {

            const section =
                sections.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!section) {

                return;

            }


            const confirmed =
                confirm(
                    `Are you sure you want to deactivate section "${section.name}"?`
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/admin/sections/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to deactivate section"
                    );

                }


                await loadSections();


                showToast(
                    "Section deactivated successfully",
                    "success"
                );


            } catch (error) {

                console.error(error);


                showToast(
                    error.message,
                    "error"
                );

            }

        }


        // ==========================================
        // CLOSE MODAL
        // ==========================================

        function closeModal() {

            document
                .getElementById(
                    "sectionModal"
                )
                .classList.remove(
                    "show"
                );

        }


        // ==========================================
        // TOAST
        // ==========================================

        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.className =
                `toast show ${type}`;


            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                3000
            );

        }


        // ==========================================
        // HTML ESCAPE
        // ==========================================

        function escapeHtml(value) {

            return String(value)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        // ==========================================
        // CLOSE MODAL OUTSIDE CLICK
        // ==========================================

        document
            .getElementById(
                "sectionModal"
            )
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target === this
                    ) {

                        closeModal();

                    }

                }
            );


        // ==========================================
        // ESCAPE KEY
        // ==========================================

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );

    </script>

</body>
