<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | College Attendance</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f7fb;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        /* =====================================================
           LOGIN WRAPPER
        ===================================================== */

        .login-wrapper {

            width: 100%;

            max-width: 430px;

            padding: 20px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            width: 100%;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.06);
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            width: 58px;

            height: 58px;

            margin: 0 auto 18px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            color: #ffffff;
        }


        .brand svg {

            width: 28px;

            height: 28px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .login-title {

            margin: 0 0 5px;

            text-align: center;

            font-size: 24px;

            line-height: 1.3;

            font-weight: 700;

            color: #111827;
        }


        .login-subtitle {

            margin: 0 0 28px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group.password-group {

            margin-bottom: 24px;
        }


        /* =====================================================
           LABEL
        ===================================================== */

        .form-label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            line-height: 1.4;

            font-weight: 600;

            color: #374151;
        }


        /* =====================================================
           INPUT GROUP
        ===================================================== */

        .input-group {

            width: 100%;

            height: 46px;

            display: flex;

            align-items: stretch;
        }


        /* =====================================================
           INPUT ICON
        ===================================================== */

        .input-icon {

            width: 46px;

            min-width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f9fafb;

            border: 1px solid #d1d5db;

            border-right: 0;

            border-radius: 8px 0 0 8px;

            color: #6b7280;
        }


        .input-icon svg {

            width: 17px;

            height: 17px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           FORM INPUT
        ===================================================== */

        .form-control {

            width: 100%;

            height: 46px;

            min-width: 0;

            padding: 0 13px;

            border: 1px solid #d1d5db;

            border-radius: 0 8px 8px 0;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.5;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-control::placeholder {

            color: #9ca3af;
        }


        .form-control:focus {

            border-color: #111827;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }


        /* =====================================================
           PASSWORD INPUT
        ===================================================== */

        .password-input {

            border-radius: 0;
        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        .password-toggle {

            width: 46px;

            min-width: 46px;

            height: 46px;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #d1d5db;

            border-left: 0;

            border-radius: 0 8px 8px 0;

            background: #f9fafb;

            color: #6b7280;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .password-toggle:hover {

            background: #f3f4f6;

            color: #111827;
        }


        .password-toggle:focus {

            outline: none;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }


        .password-toggle svg {

            width: 17px;

            height: 17px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           ERROR BOX
        ===================================================== */

        .error-box {

            display: none;

            width: 100%;

            margin-bottom: 18px;

            padding: 10px 12px;

            display: none;

            align-items: flex-start;

            gap: 7px;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.5;
        }


        .error-box svg {

            width: 15px;

            min-width: 15px;

            height: 15px;

            margin-top: 1px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .error-message {

            word-break: break-word;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            height: 46px;

            padding: 0 16px;

            border: 0;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }


        .login-btn:hover {

            background: #1f2937;
        }


        .login-btn:active {

            transform: scale(0.99);
        }


        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading-content {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;
        }


        .spinner {

            width: 15px;

            height: 15px;

            border: 2px solid rgba(255, 255, 255, 0.35);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer-text {

            margin-top: 22px;

            text-align: center;

            color: #9ca3af;

            font-size: 11px;

            line-height: 1.5;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                align-items: center;
            }


            .login-wrapper {

                padding: 15px;
            }


            .login-card {

                padding: 28px 22px;

                border-radius: 16px;
            }


            .login-title {

                font-size: 22px;
            }


            .login-subtitle {

                margin-bottom: 24px;
            }
        }


        @media (max-width: 360px) {

            .login-wrapper {

                padding: 10px;
            }


            .login-card {

                padding: 24px 18px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOGIN WRAPPER
    ===================================================== -->

    <div class="login-wrapper">


        <!-- =================================================
             LOGIN CARD
        ================================================= -->

        <div class="login-card">


            <!-- =================================================
                 BRAND
            ================================================= -->

            <div class="brand">

                <!-- Person Bounding Box Icon -->

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="3">
                    </rect>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.5">
                    </circle>

                    <path
                        d="M7.5 18c.7-2.4 2.1-3.6 4.5-3.6s3.8 1.2 4.5 3.6">
                    </path>

                </svg>

            </div>


            <!-- =================================================
                 TITLE
            ================================================= -->

            <h1 class="login-title">

                Admin Login

            </h1>


            <p class="login-subtitle">

                College Attendance Management System

            </p>


            <!-- =================================================
                 ERROR
            ================================================= -->

            <div
                id="errorBox"
                class="error-box"
                role="alert">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">

                    <circle
                        cx="12"
                        cy="12"
                        r="9">
                    </circle>

                    <path
                        d="M12 8v5">
                    </path>

                    <path
                        d="M12 16h.01">
                    </path>

                </svg>


                <span
                    id="errorMessage"
                    class="error-message">

                    Invalid username or password.

                </span>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================= -->

            <form id="loginForm">


                <!-- =================================================
                     USERNAME
                ================================================= -->

                <div class="form-group">

                    <label
                        for="username"
                        class="form-label">

                        Username

                    </label>


                    <div class="input-group">


                        <!-- USER ICON -->

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="3.5">
                                </circle>

                                <path
                                    d="M5 20c.8-3.5 3.1-5.5 7-5.5s6.2 2 7 5.5">
                                </path>

                            </svg>

                        </span>


                        <!-- USERNAME INPUT -->

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================= -->

                <div class="form-group password-group">

                    <label
                        for="password"
                        class="form-label">

                        Password

                    </label>


                    <div class="input-group">


                        <!-- LOCK ICON -->

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2">
                                </rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3">
                                </path>

                            </svg>

                        </span>


                        <!-- PASSWORD INPUT -->

                        <input
                            type="password"
                            id="password"
                            class="form-control password-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>


                        <!-- PASSWORD TOGGLE -->

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password">


                            <!-- EYE ICON -->

                            <svg
                                id="passwordIcon"
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z">
                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================= -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    <span id="loginBtnText">

                        Login

                    </span>

                </button>


            </form>


            <!-- =================================================
                 FOOTER
            ================================================= -->

            <div class="footer-text">

                © <span id="currentYear"></span>

                College Attendance System

            </div>


        </div>

    </div>


    <script>

        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const API_BASE_URL =
            "http://localhost:8080";


        /*
         * Backend controller:
         *
         * @RequestMapping("/api/auth")
         * @PostMapping("/login")
         *
         * Endpoint:
         *
         * POST /api/auth/login
         */

        const LOGIN_URL =
            `${API_BASE_URL}/api/auth/login`;


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");


        const loginBtn =
            document.getElementById("loginBtn");


        const loginBtnText =
            document.getElementById("loginBtnText");


        const errorBox =
            document.getElementById("errorBox");


        const errorMessage =
            document.getElementById("errorMessage");


        const usernameInput =
            document.getElementById("username");


        const passwordInput =
            document.getElementById("password");


        const togglePassword =
            document.getElementById("togglePassword");


        const passwordIcon =
            document.getElementById("passwordIcon");


        /* =====================================================
           CHECK EXISTING LOGIN
        ===================================================== */

        const existingToken =
            localStorage.getItem("accessToken");


        if (existingToken) {

            window.location.replace(
                "dashboard.html"
            );

        }


        /* =====================================================
           PASSWORD VISIBILITY
        ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {


                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";


                    /*
                     * Change eye icon to eye-slash
                     */

                    passwordIcon.innerHTML = `

                        <path
                            d="M2 12s3.5-6 10-6c2.3 0 4.3.8 5.8 1.8">
                        </path>

                        <path
                            d="M21.5 12s-3.5 6-9.5 6c-2.3 0-4.3-.8-5.8-1.8">
                        </path>

                        <path
                            d="M4 4l16 16">
                        </path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5">
                        </circle>

                    `;


                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type = "password";


                    /*
                     * Change back to eye icon
                     */

                    passwordIcon.innerHTML = `

                        <path
                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z">
                        </path>

                        <circle
                            cx="12"
                            cy="12"
                            r="2.5">
                        </circle>

                    `;


                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                hideError();


                const username =
                    usernameInput.value.trim();


                const password =
                    passwordInput.value;


                /* =================================================
                   BASIC VALIDATION
                ================================================= */

                if (!username) {

                    showError(
                        "Please enter username."
                    );

                    usernameInput.focus();

                    return;

                }


                if (!password) {

                    showError(
                        "Please enter password."
                    );

                    passwordInput.focus();

                    return;

                }


                setLoading(true);


                try {


                    /* =============================================
                       API REQUEST
                    ============================================= */

                    const response =
                        await fetch(
                            LOGIN_URL,
                            {
                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                            }
                        );


                    /* =============================================
                       RESPONSE
                    ============================================= */

                    let data = {};


                    const contentType =
                        response.headers.get(
                            "content-type"
                        );


                    /*
                     * Parse JSON only when
                     * response is actually JSON.
                     */

                    if (
                        contentType &&
                        contentType.includes(
                            "application/json"
                        )
                    ) {

                        data =
                            await response.json();

                    }


                    console.log(
                        "Login Response:",
                        response.status,
                        data
                    );


                    /* =============================================
                       HTTP ERROR
                    ============================================= */

                    if (!response.ok) {


                        if (
                            response.status === 401
                        ) {

                            throw new Error(
                                "Invalid username or password."
                            );

                        }


                        if (
                            response.status === 403
                        ) {

                            throw new Error(
                                "Access denied. Admin login required."
                            );

                        }


                        throw new Error(
                            data.message ||
                            `Login failed. HTTP ${response.status}`
                        );

                    }


                    /* =============================================
                       GET ACCESS TOKEN
                    ============================================= */

                    const token =
                        data.accessToken ||
                        data.token;


                    if (!token) {

                        throw new Error(
                            "Login successful but access token was not received."
                        );

                    }


                    /* =============================================
                       CHECK ADMIN ROLE
                    ============================================= */

                    if (
                        data.role &&
                        data.role.toUpperCase() !== "ADMIN"
                    ) {

                        throw new Error(
                            "Access denied. Admin login required."
                        );

                    }


                    /* =============================================
                       SAVE AUTH DATA
                    ============================================= */

                    localStorage.setItem(
                        "accessToken",
                        token
                    );


                    localStorage.setItem(
                        "tokenType",
                        data.tokenType || "Bearer"
                    );


                    if (data.username) {

                        localStorage.setItem(
                            "adminUsername",
                            data.username
                        );

                    } else {

                        localStorage.setItem(
                            "adminUsername",
                            username
                        );

                    }


                    if (data.role) {

                        localStorage.setItem(
                            "adminRole",
                            data.role
                        );

                    }


                    /* =============================================
                       REDIRECT TO DASHBOARD
                    ============================================= */

                    window.location.replace(
                        "dashboard.html"
                    );

                }


                catch (error) {


                    console.error(
                        "Login Error:",
                        error
                    );


                    showError(
                        error.message ||
                        "Unable to login. Please try again."
                    );

                }


                finally {

                    setLoading(false);

                }

            }
        );


        /* =====================================================
           LOADING STATE
        ===================================================== */

        function setLoading(isLoading) {

            loginBtn.disabled =
                isLoading;


            if (isLoading) {

                loginBtnText.innerHTML = `

                    <span class="loading-content">

                        <span
                            class="spinner"
                            aria-hidden="true">
                        </span>

                        <span>
                            Logging in...
                        </span>

                    </span>

                `;

            } else {

                loginBtnText.innerText =
                    "Login";

            }

        }


        /* =====================================================
           SHOW ERROR
        ===================================================== */

        function showError(message) {

            errorMessage.innerText =
                message;

            errorBox.style.display =
                "flex";

        }


        /* =====================================================
           HIDE ERROR
        ===================================================== */

        function hideError() {

            errorBox.style.display =
                "none";

        }


        /* =====================================================
           CURRENT YEAR
        ===================================================== */

        document.getElementById(
            "currentYear"
        ).innerText =
            new Date().getFullYear();

    </script>


</body>

</html>
