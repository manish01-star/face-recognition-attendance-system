<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | College Attendance</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f7fb;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .login-wrapper {

            width: 100%;

            max-width: 430px;

            padding: 20px;
        }

        .login-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.06);
        }

        .brand {

            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            color: white;

            font-size: 26px;
        }

        .login-title {

            text-align: center;

            font-size: 24px;

            font-weight: 700;

            margin-bottom: 5px;

            color: #111827;
        }

        .login-subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 28px;
        }

        .form-label {

            font-size: 13px;

            font-weight: 600;

            color: #374151;
        }

        .input-group-text {

            background: #f9fafb;

            border-color: #d1d5db;

            color: #6b7280;
        }

        .form-control {

            height: 46px;

            border-color: #d1d5db;

            font-size: 14px;
        }

        .form-control:focus {

            border-color: #111827;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .login-btn {

            height: 46px;

            width: 100%;

            border: 0;

            border-radius: 9px;

            background: #111827;

            color: white;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }

        .login-btn:hover {

            background: #1f2937;
        }

        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }

        .error-box {

            display: none;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            border-radius: 8px;

            padding: 10px 12px;

            font-size: 12px;

            margin-bottom: 18px;
        }

        .footer-text {

            text-align: center;

            color: #9ca3af;

            font-size: 11px;

            margin-top: 22px;
        }

    </style>

</head>


<body>


<div class="login-wrapper">

    <div class="login-card">


        <!-- BRAND -->

        <div class="brand">

            <i class="bi bi-person-bounding-box"></i>

        </div>


        <!-- TITLE -->

        <h1 class="login-title">

            Admin Login

        </h1>


        <p class="login-subtitle">

            College Attendance Management System

        </p>


        <!-- ERROR -->

        <div
            id="errorBox"
            class="error-box">

            <i class="bi bi-exclamation-circle me-1"></i>

            <span id="errorMessage">

                Invalid username or password.

            </span>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label">

                    Username

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>


                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>


                    <button
                        type="button"
                        id="togglePassword"
                        class="input-group-text border-start-0">

                        <i
                            id="passwordIcon"
                            class="bi bi-eye">
                        </i>

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginBtn"
                class="login-btn">

                <span id="loginBtnText">

                    Login

                </span>

            </button>


        </form>


        <!-- FOOTER -->

        <div class="footer-text">

            © <span id="currentYear"></span>

            College Attendance System

        </div>


    </div>

</div>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE_URL =
    "http://localhost:8080";


/*
 * IMPORTANT
 *
 * Backend controller:
 *
 * @RequestMapping("/api/auth")
 * @PostMapping("/login")
 *
 * Therefore endpoint is:
 *
 * POST /api/auth/login
 */
const LOGIN_URL =
    `${API_BASE_URL}/api/auth/login`;


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const loginBtnText =
    document.getElementById("loginBtnText");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");


/* =========================================================
   CHECK EXISTING LOGIN
========================================================= */

const existingToken =
    localStorage.getItem("accessToken");


if (existingToken) {

    window.location.replace(
        "dashboard.html"
    );

}


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

document
    .getElementById("togglePassword")
    .addEventListener(
        "click",
        () => {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.className =
                    "bi bi-eye-slash";

            } else {

                password.type = "password";

                icon.className =
                    "bi bi-eye";

            }

        }
    );


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideError();

        setLoading(true);


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        try {


            /* =================================================
               API REQUEST
            ================================================= */

            const response =
                await fetch(
                    LOGIN_URL,
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })
                    }
                );


            /* =================================================
               RESPONSE
            ================================================= */

            let data = {};

            const contentType =
                response.headers.get(
                    "content-type"
                );


            /*
             * Only parse JSON when
             * response actually contains JSON.
             */
            if (
                contentType &&
                contentType.includes(
                    "application/json"
                )
            ) {

                data =
                    await response.json();

            }


            console.log(
                "Login Response:",
                response.status,
                data
            );


            /* =================================================
               HTTP ERROR
            ================================================= */

            if (!response.ok) {


                if (response.status === 401) {

                    throw new Error(
                        "Invalid username or password."
                    );

                }


                if (response.status === 403) {

                    throw new Error(
                        "Access denied. Admin login required."
                    );

                }


                throw new Error(
                    data.message ||
                    `Login failed. HTTP ${response.status}`
                );

            }


            /* =================================================
               GET TOKEN
            ================================================= */

            const token =
                data.accessToken ||
                data.token;


            if (!token) {

                throw new Error(
                    "Login successful but access token was not received."
                );

            }


            /* =================================================
               CHECK ROLE
            ================================================= */

            if (
                data.role &&
                data.role.toUpperCase() !== "ADMIN"
            ) {

                throw new Error(
                    "Access denied. Admin login required."
                );

            }


            /* =================================================
               SAVE AUTH DATA
            ================================================= */

            localStorage.setItem(
                "accessToken",
                token
            );


            if (data.tokenType) {

                localStorage.setItem(
                    "tokenType",
                    data.tokenType
                );

            } else {

                localStorage.setItem(
                    "tokenType",
                    "Bearer"
                );

            }


            if (data.username) {

                localStorage.setItem(
                    "adminUsername",
                    data.username
                );

            }


            if (data.role) {

                localStorage.setItem(
                    "adminRole",
                    data.role
                );

            }


            /* =================================================
               REDIRECT
            ================================================= */

            window.location.replace(
                "dashboard.html"
            );


        } catch (error) {


            console.error(
                "Login Error:",
                error
            );


            showError(
                error.message ||
                "Unable to login. Please try again."
            );


        } finally {

            setLoading(false);

        }

    }
);


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    isLoading
) {

    loginBtn.disabled =
        isLoading;


    loginBtnText.innerHTML =
        isLoading

            ? `
                <span
                    class="spinner-border spinner-border-sm me-2">
                </span>

                Logging in...
              `

            : "Login";

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    message
) {

    errorMessage.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================================
   HIDE ERROR
========================================================= */

function hideError() {

    errorBox.style.display =
        "none";

}


/* =========================================================
   CURRENT YEAR
========================================================= */

document.getElementById(
    "currentYear"
).innerText =
    new Date().getFullYear();


</script>


</body>

</html>
