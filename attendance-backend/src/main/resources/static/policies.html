<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Policies | FaceAttend Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common Sidebar CSS -->
    <link rel="stylesheet" href="/css/sidebar.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
        }

        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar-left h3 {
            font-size: 20px;
            color: #111827;
        }

        /* Scoped so it does not conflict with sidebar admin-info */
        .navbar .admin-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar .admin-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .navbar .admin-name {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .navbar .admin-role {
            font-size: 11px;
            color: #64748b;
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .page-title p {
            color: #64748b;
            font-size: 14px;
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: #fff;
        }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        /* =====================================================
           STATS
        ===================================================== */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-info h2 {
            font-size: 26px;
        }

        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: #2563eb;
            font-size: 21px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h3 {
            font-size: 17px;
        }

        /* =====================================================
           FILTERS
        ===================================================== */

        .filters {
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 11px;
            color: #94a3b8;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        .filters select {
            min-width: 160px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: #fff;
        }

        /* =====================================================
           TABLE
        ===================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 13px 16px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            padding: 15px 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .policy-name {
            font-weight: 600;
            color: #0f172a;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
        }

        .location i {
            color: #2563eb;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .days {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }

        /* =====================================================
           ACTIONS
        ===================================================== */

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-edit {
            background: #eff6ff;
            color: #2563eb;
        }

        .action-activate {
            background: #dcfce7;
            color: #16a34a;
        }

        .action-deactivate {
            background: #fee2e2;
            color: #dc2626;
        }

        /* =====================================================
           EMPTY / LOADER
        ===================================================== */

        .loader,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .loader i {
            font-size: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            100% {
                transform: rotate(360deg);
            }

        }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-modal {
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }

        .modal-body {
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #2563eb;
        }

        .checkbox-row {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            min-width: 280px;
            max-width: 400px;
            background: #111827;
            color: #fff;
            padding: 14px 18px;
            border-radius: 8px;
            display: none;
            z-index: 3000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .2);
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            background: #166534;
        }

        .toast.error {
            background: #991b1b;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 768px) {

            .content {
                padding: 20px;
            }

            .page-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 15px;
            }

            .content {
                padding: 15px;
            }

            .navbar .admin-info {
                display: none;
            }

        }

        @media (max-width: 500px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>

</head>


<body>

    <!-- =========================================================
         COMMON SIDEBAR
    ========================================================= -->

    <div id="sidebar-container"></div>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================= -->

    <main class="main-wrapper">

        <!-- =====================================================
             NAVBAR
        ===================================================== -->

        <nav class="navbar">

            <div class="navbar-left">

                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">

                    ☰

                </button>

                <h3>Attendance Policies</h3>

            </div>


            <div class="admin-info">

                <div class="admin-avatar">
                    A
                </div>

                <span>Admin</span>

            </div>

        </nav>


        <!-- =====================================================
             CONTENT
        ===================================================== -->

        <main class="content">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <div class="page-title">

                    <h1>Attendance Policies</h1>

                    <p>
                        Manage college attendance rules, working hours
                        and location restrictions.
                    </p>

                </div>


                <button class="btn btn-primary" onclick="openAddModal()">

                    <i class="bi bi-plus-lg"></i>

                    Add Policy

                </button>

            </div>


            <!-- =================================================
                 STATS
            ================================================= -->

            <div class="stats-grid">

                <div class="stat-card">

                    <div class="stat-info">

                        <span>Total Policies</span>

                        <h2 id="totalPolicies">
                            0
                        </h2>

                    </div>

                    <div class="stat-icon">

                        <i class="bi bi-shield-check"></i>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-info">

                        <span>Active</span>

                        <h2 id="activePolicies">
                            0
                        </h2>

                    </div>

                    <div class="stat-icon">

                        <i class="bi bi-check-circle"></i>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-info">

                        <span>Inactive</span>

                        <h2 id="inactivePolicies">
                            0
                        </h2>

                    </div>

                    <div class="stat-icon">

                        <i class="bi bi-x-circle"></i>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-info">

                        <span>Current Policy</span>

                        <h2 id="currentPolicy">
                            -
                        </h2>

                    </div>

                    <div class="stat-icon">

                        <i class="bi bi-star"></i>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 TABLE CARD
            ================================================= -->

            <div class="card">

                <div class="card-header">

                    <h3>
                        Policy List
                    </h3>

                </div>


                <!-- FILTERS -->

                <div class="filters">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input type="text" id="searchInput" placeholder="Search policy or location..."
                            oninput="applyFilters()">

                    </div>


                    <select id="statusFilter" onchange="applyFilters()">

                        <option value="">
                            All Status
                        </option>

                        <option value="ACTIVE">
                            Active
                        </option>

                        <option value="INACTIVE">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- TABLE -->

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>Policy</th>

                                <th>Working Hours</th>

                                <th>Working Days</th>

                                <th>Location</th>

                                <th>Radius</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>


                        <tbody id="policyTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </main>


    <!-- =========================================================
         ADD / EDIT MODAL
    ========================================================= -->

    <div class="modal" id="policyModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Attendance Policy
                </h2>

                <button class="close-modal" onclick="closeModal()" type="button">

                    <i class="bi bi-x"></i>

                </button>

            </div>


            <div class="modal-body">

                <form id="policyForm">

                    <input type="hidden" id="policyId">


                    <div class="form-grid">

                        <!-- POLICY NAME -->

                        <div class="form-group full">

                            <label>
                                Policy Name *
                            </label>

                            <input type="text" id="policyName" class="form-control" maxlength="100"
                                placeholder="e.g. Default College Attendance Policy" required>

                        </div>


                        <!-- WORKING HOURS -->

                        <div class="form-group">

                            <label>
                                Working Hours *
                            </label>

                            <input type="number" id="workingHours" class="form-control" min="0.1" max="24" step="0.01"
                                value="6" required>

                        </div>


                        <!-- RADIUS -->

                        <div class="form-group">

                            <label>
                                Allowed Radius (Meters) *
                            </label>

                            <input type="number" id="allowedRadiusMeters" class="form-control" min="1" max="10000"
                                step="0.01" value="200" required>

                        </div>


                        <!-- LOCATION -->

                        <div class="form-group full">

                            <label>
                                Location Name *
                            </label>

                            <input type="text" id="locationName" class="form-control" maxlength="150"
                                placeholder="College Campus" required>

                        </div>


                        <!-- LATITUDE -->

                        <div class="form-group">

                            <label>
                                Latitude *
                            </label>

                            <input type="number" id="latitude" class="form-control" min="-90" max="90" step="0.0000001"
                                placeholder="28.1228822" required>

                        </div>


                        <!-- LONGITUDE -->

                        <div class="form-group">

                            <label>
                                Longitude *
                            </label>

                            <input type="number" id="longitude" class="form-control" min="-180" max="180"
                                step="0.0000001" placeholder="77.5542396" required>

                        </div>


                        <!-- WORKING DAYS -->

                        <div class="form-group full">

                            <label>
                                Weekly Configuration
                            </label>

                            <div class="checkbox-row">

                                <label class="checkbox-item">

                                    <input type="checkbox" id="saturdayOff">

                                    Saturday Off

                                </label>


                                <label class="checkbox-item">

                                    <input type="checkbox" id="sundayOff" checked>

                                    Sunday Off

                                </label>


                                <label class="checkbox-item">

                                    <input type="checkbox" id="attendanceRequired" checked>

                                    Attendance Required

                                </label>

                            </div>

                        </div>


                        <!-- STATUS -->

                        <div class="form-group">

                            <label>
                                Status
                            </label>

                            <select id="status" class="form-control">

                                <option value="ACTIVE">
                                    Active
                                </option>

                                <option value="INACTIVE">
                                    Inactive
                                </option>

                            </select>

                        </div>

                    </div>

                </form>

            </div>


            <div class="modal-footer">

                <button class="btn btn-secondary" onclick="closeModal()" type="button">

                    Cancel

                </button>


                <button class="btn btn-primary" onclick="savePolicy()" type="button">

                    <i class="bi bi-check-lg"></i>

                    Save Policy

                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         TOAST
    ========================================================= -->

    <div class="toast" id="toast">

        <span id="toastMessage"></span>

    </div>


    <!-- =========================================================
         AUTH
    ========================================================= -->

    <script src="/js/auth.js"></script>


    <!-- =========================================================
         PAGE SCRIPT
    ========================================================= -->

    <script>

        const API_BASE_URL = "http://localhost:8080";

        let policies = [];

        let filteredPolicies = [];


        // =========================================================
        // INIT
        // =========================================================

        document.addEventListener("DOMContentLoaded", function () {

            loadPolicies();

        });


        // =========================================================
        // LOAD POLICIES
        // =========================================================

        async function loadPolicies() {

            const tbody =
                document.getElementById("policyTableBody");

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="loader">
                            <i class="bi bi-arrow-repeat"></i>
                            <p>Loading policies...</p>
                        </div>
                    </td>
                </tr>
            `;

            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/attendance-policies/admin`
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                policies = await response.json();

                updateStats();

                applyFilters();

            } catch (error) {

                console.error(
                    "Failed to load policies:",
                    error
                );

                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty">
                                <i class="bi bi-exclamation-circle"></i>
                                <p>
                                    Failed to load attendance policies.
                                </p>
                            </div>
                        </td>
                    </tr>
                `;

                showToast(
                    "Failed to load attendance policies",
                    "error"
                );

            }

        }


        // =========================================================
        // STATS
        // =========================================================

        function updateStats() {

            const total =
                policies.length;

            const active =
                policies.filter(
                    p => p.status === "ACTIVE"
                ).length;

            const inactive =
                policies.filter(
                    p => p.status === "INACTIVE"
                ).length;

            const current =
                policies.find(
                    p => p.status === "ACTIVE"
                );


            document.getElementById(
                "totalPolicies"
            ).textContent = total;


            document.getElementById(
                "activePolicies"
            ).textContent = active;


            document.getElementById(
                "inactivePolicies"
            ).textContent = inactive;


            document.getElementById(
                "currentPolicy"
            ).textContent =
                current
                    ? current.policyName
                    : "-";

        }


        // =========================================================
        // FILTER
        // =========================================================

        function applyFilters() {

            const search =
                document.getElementById(
                    "searchInput"
                ).value
                    .trim()
                    .toLowerCase();


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            filteredPolicies =
                policies.filter(policy => {

                    const matchesSearch =
                        !search ||
                        (policy.policyName || "")
                            .toLowerCase()
                            .includes(search) ||
                        (policy.locationName || "")
                            .toLowerCase()
                            .includes(search);


                    const matchesStatus =
                        !status ||
                        policy.status === status;


                    return matchesSearch &&
                        matchesStatus;

                });


            renderPolicies();

        }


        // =========================================================
        // RENDER
        // =========================================================

        function renderPolicies() {

            const tbody =
                document.getElementById(
                    "policyTableBody"
                );


            if (!filteredPolicies.length) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty">
                                <i class="bi bi-shield-x"></i>
                                <p>
                                    No attendance policies found.
                                </p>
                            </div>
                        </td>
                    </tr>
                `;

                return;

            }


            tbody.innerHTML =
                filteredPolicies
                    .map((policy, index) => {

                        const statusClass =
                            policy.status === "ACTIVE"
                                ? "status-active"
                                : "status-inactive";


                        const workingDays = [];


                        if (!policy.saturdayOff) {

                            workingDays.push(
                                "Saturday"
                            );

                        }


                        if (!policy.sundayOff) {

                            workingDays.push(
                                "Sunday"
                            );

                        }


                        const weekdays =
                            [
                                "Monday",
                                "Tuesday",
                                "Wednesday",
                                "Thursday",
                                "Friday"
                            ];


                        const workingDayText =
                            weekdays
                                .concat(workingDays)
                                .join(", ");


                        return `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>


                                <td>

                                    <div class="policy-name">

                                        ${escapeHtml(
                            policy.policyName || "-"
                        )}

                                    </div>

                                </td>


                                <td>

                                    <strong>
                                        ${policy.workingHours ?? "-"}
                                    </strong>

                                    hrs

                                </td>


                                <td>

                                    <div class="days">

                                        ${escapeHtml(
                            workingDayText
                        )}

                                    </div>

                                </td>


                                <td>

                                    <div class="location">

                                        <i class="bi bi-geo-alt-fill"></i>

                                        ${escapeHtml(
                            policy.locationName || "-"
                        )}

                                    </div>

                                </td>


                                <td>

                                    ${policy.allowedRadiusMeters ?? "-"}
                                    m

                                </td>


                                <td>

                                    <span class="status ${statusClass}">

                                        ${policy.status}

                                    </span>

                                </td>


                                <td>

                                    <div class="actions">

                                        <button
                                            class="action-btn action-edit"
                                            title="Edit"
                                            onclick="editPolicy(${policy.id})">

                                            <i class="bi bi-pencil"></i>

                                        </button>


                                        ${policy.status === "ACTIVE"
                                ?

                                `
                                                <button
                                                    class="action-btn action-deactivate"
                                                    title="Deactivate"
                                                    onclick="deactivatePolicy(${policy.id})">

                                                    <i class="bi bi-x-circle"></i>

                                                </button>
                                                `

                                :

                                `
                                                <button
                                                    class="action-btn action-activate"
                                                    title="Activate"
                                                    onclick="activatePolicy(${policy.id})">

                                                    <i class="bi bi-check-circle"></i>

                                                </button>
                                                `
                            }

                                    </div>

                                </td>

                            </tr>

                        `;

                    })
                    .join("");

        }


        // =========================================================
        // ADD MODAL
        // =========================================================

        function openAddModal() {

            document.getElementById(
                "modalTitle"
            ).textContent =
                "Add Attendance Policy";


            document.getElementById(
                "policyForm"
            ).reset();


            document.getElementById(
                "policyId"
            ).value = "";


            document.getElementById(
                "workingHours"
            ).value = "6";


            document.getElementById(
                "allowedRadiusMeters"
            ).value = "200";


            document.getElementById(
                "sundayOff"
            ).checked = true;


            document.getElementById(
                "attendanceRequired"
            ).checked = true;


            document.getElementById(
                "status"
            ).value = "ACTIVE";


            document.getElementById(
                "policyModal"
            ).classList.add("show");

        }


        // =========================================================
        // EDIT
        // =========================================================

        function editPolicy(id) {

            const policy =
                policies.find(
                    p => p.id === id
                );


            if (!policy) {

                showToast(
                    "Policy not found",
                    "error"
                );

                return;

            }


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Attendance Policy";


            document.getElementById(
                "policyId"
            ).value =
                policy.id;


            document.getElementById(
                "policyName"
            ).value =
                policy.policyName || "";


            document.getElementById(
                "workingHours"
            ).value =
                policy.workingHours ?? 6;


            document.getElementById(
                "allowedRadiusMeters"
            ).value =
                policy.allowedRadiusMeters ?? 200;


            document.getElementById(
                "locationName"
            ).value =
                policy.locationName || "";


            document.getElementById(
                "latitude"
            ).value =
                policy.latitude ?? "";


            document.getElementById(
                "longitude"
            ).value =
                policy.longitude ?? "";


            document.getElementById(
                "saturdayOff"
            ).checked =
                !!policy.saturdayOff;


            document.getElementById(
                "sundayOff"
            ).checked =
                !!policy.sundayOff;


            document.getElementById(
                "attendanceRequired"
            ).checked =
                policy.attendanceRequired !== false;


            document.getElementById(
                "status"
            ).value =
                policy.status || "ACTIVE";


            document.getElementById(
                "policyModal"
            ).classList.add("show");

        }


        // =========================================================
        // SAVE
        // =========================================================

        async function savePolicy() {

            const id =
                document.getElementById(
                    "policyId"
                ).value;


            const payload = {

                policyName:
                    document.getElementById(
                        "policyName"
                    ).value.trim(),


                saturdayOff:
                    document.getElementById(
                        "saturdayOff"
                    ).checked,


                sundayOff:
                    document.getElementById(
                        "sundayOff"
                    ).checked,


                workingHours:
                    parseFloat(
                        document.getElementById(
                            "workingHours"
                        ).value
                    ),


                attendanceRequired:
                    document.getElementById(
                        "attendanceRequired"
                    ).checked,


                locationName:
                    document.getElementById(
                        "locationName"
                    ).value.trim(),


                latitude:
                    parseFloat(
                        document.getElementById(
                            "latitude"
                        ).value
                    ),


                longitude:
                    parseFloat(
                        document.getElementById(
                            "longitude"
                        ).value
                    ),


                allowedRadiusMeters:
                    parseFloat(
                        document.getElementById(
                            "allowedRadiusMeters"
                        ).value
                    ),


                status:
                    document.getElementById(
                        "status"
                    ).value

            };


            if (!payload.policyName) {

                showToast(
                    "Policy name is required",
                    "error"
                );

                return;

            }


            if (!payload.locationName) {

                showToast(
                    "Location name is required",
                    "error"
                );

                return;

            }


            if (
                isNaN(payload.latitude) ||
                payload.latitude < -90 ||
                payload.latitude > 90
            ) {

                showToast(
                    "Enter a valid latitude",
                    "error"
                );

                return;

            }


            if (
                isNaN(payload.longitude) ||
                payload.longitude < -180 ||
                payload.longitude > 180
            ) {

                showToast(
                    "Enter a valid longitude",
                    "error"
                );

                return;

            }


            try {

                let response;


                if (id) {

                    response =
                        await apiFetch(
                            `${API_BASE_URL}/api/attendance-policies/${id}`,
                            {
                                method: "PUT",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify(payload)
                            }
                        );

                } else {

                    response =
                        await apiFetch(
                            `${API_BASE_URL}/api/attendance-policies`,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify(payload)
                            }
                        );

                }


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        errorText ||
                        `HTTP ${response.status}`
                    );

                }


                closeModal();


                showToast(
                    id
                        ? "Attendance policy updated successfully"
                        : "Attendance policy created successfully",
                    "success"
                );


                await loadPolicies();

            } catch (error) {

                console.error(
                    "Save policy error:",
                    error
                );


                showToast(
                    "Failed to save attendance policy",
                    "error"
                );

            }

        }


        // =========================================================
        // DEACTIVATE
        // =========================================================

        async function deactivatePolicy(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to deactivate this attendance policy?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/attendance-policies/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                showToast(
                    "Attendance policy deactivated successfully",
                    "success"
                );


                await loadPolicies();

            } catch (error) {

                console.error(
                    "Deactivate policy error:",
                    error
                );


                showToast(
                    "Failed to deactivate policy",
                    "error"
                );

            }

        }


        // =========================================================
        // ACTIVATE
        // =========================================================

        async function activatePolicy(id) {

            const confirmed =
                confirm(
                    "Activate this policy? The current active policy will become inactive."
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await apiFetch(
                        `${API_BASE_URL}/api/attendance-policies/${id}/activate`,
                        {
                            method: "PUT"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                showToast(
                    "Attendance policy activated successfully",
                    "success"
                );


                await loadPolicies();

            } catch (error) {

                console.error(
                    "Activate policy error:",
                    error
                );


                showToast(
                    "Failed to activate policy",
                    "error"
                );

            }

        }


        // =========================================================
        // CLOSE MODAL
        // =========================================================

        function closeModal() {

            document.getElementById(
                "policyModal"
            ).classList.remove("show");

        }


        // =========================================================
        // TOAST
        // =========================================================

        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            const toastMessage =
                document.getElementById(
                    "toastMessage"
                );


            toastMessage.textContent =
                message;


            toast.className =
                `toast show ${type}`;


            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 3000);

        }


        // =========================================================
        // ESCAPE HTML
        // =========================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =========================================================
        // CLOSE ON OUTSIDE CLICK
        // =========================================================

        document.getElementById(
            "policyModal"
        ).addEventListener(
            "click",
            function (event) {

                if (event.target === this) {

                    closeModal();

                }

            }
        );


        // =========================================================
        // ESC KEY
        // =========================================================

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeModal();

                }

            }
        );

    </script>
